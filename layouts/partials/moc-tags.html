{{ $tags := .tags }}
{{ $containerClass := .containerClass | default "post-tags-row" }}
{{ $pillClass := .pillClass | default "tag-pill" }}

{{ if $tags }}
<span class="{{ $containerClass }}">
  {{ range $tags }}
  <a href="{{ "/tags/" | relURL }}{{ . | urlize }}/" class="{{ $pillClass }}">#{{ . }}</a>
  {{ end }}
</span>
{{ end }}
